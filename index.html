<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8F9FA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="HIT Log">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>HIT Log</title>
<style>
:root{
  /* Google surface ramp */
  --bg:#F8F9FA; --surface:#FFFFFF; --surface-2:#F1F3F4; --surface-3:#E8EAED;
  --outline:#DADCE0; --outline-soft:#E8EAED;
  --txt:#202124; --txt-2:#5F6368; --txt-3:#80868B;

  /* Google accents + tonal containers */
  --blue:#1967D2;  --blue-c:#E8F0FE;  --blue-on:#174EA6;
  --green:#188038; --green-c:#E6F4EA; --green-on:#0D652D;
  --red:#D93025;   --red-c:#FCE8E6;   --red-on:#A50E0E;
  --amber:#E37400; --amber-btn:#B06000; --amber-c:#FEF7E0; --amber-on:#B06000;

  --accent:var(--blue); --accent-c:var(--blue-c); --accent-on:var(--blue-on);

  --sans:"Google Sans","Product Sans",system-ui,Roboto,-apple-system,"Segoe UI",sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --e1:0 1px 2px rgba(60,64,67,.20), 0 1px 3px 1px rgba(60,64,67,.10);
  --e2:0 1px 2px rgba(60,64,67,.20), 0 2px 6px 2px rgba(60,64,67,.10);
  --tap:56px; --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:16px;line-height:1.45;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- top app bar ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px}
.top .mark{width:34px;height:34px;border-radius:10px;background:var(--blue-c);color:var(--blue);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 34px}
.top h1{margin:0;font-size:20px;font-weight:500;letter-spacing:-.01em}
.top .sub{font-family:var(--mono);font-size:12px;color:var(--txt-3);margin-left:auto}
.wrap{padding:0 16px 16px;max-width:600px;margin:0 auto}

/* ---- segmented button (workout picker) ---- */
.seg-h{font-size:13px;color:var(--txt-2);margin:4px 0 10px;font-weight:500}
.seg{display:flex;border:1px solid var(--outline);border-radius:100px;overflow:hidden;margin-bottom:18px;background:var(--surface)}
.seg button{flex:1;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;border-right:1px solid var(--outline);padding:7px 5px;color:var(--txt-2)}
.seg button:last-child{border-right:none}
.seg button .l{font-weight:600;font-size:16px}
/* Focus labels wrap to two lines rather than truncating. A four-workout
   rotation on a phone gives each button ~80px, which "Shoulders & Triceps"
   does not fit on one line. */
.seg button .f{font-size:10px;line-height:1.2;color:var(--txt-3);text-align:center;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.seg button[aria-pressed="true"]{background:var(--accent-c);color:var(--accent-on)}
.seg button[aria-pressed="true"] .f{color:var(--accent-on);opacity:.8}

/* Session-clock readout under the hero. Reads the same way as the chips -
   inside the window is green - against the between-sessions window instead
   of the per-body-part one. */
.dueline{margin-top:14px;padding:9px 13px;border-radius:100px;font-size:12.5px;font-weight:500;
  background:var(--surface-2);color:var(--txt-2);text-align:center}
.dueline.ready{background:var(--green-c);color:var(--green-on)}
.dueline.late{background:var(--amber-c);color:var(--amber-on)}

/* ---- hero card ---- */
.hero{background:var(--surface);border-radius:var(--r);box-shadow:var(--e1);padding:18px;margin-bottom:16px}
.hero .rowtop{display:flex;align-items:center;gap:14px}
.hero .tile{width:56px;height:56px;flex:0 0 56px;border-radius:16px;background:var(--accent-c);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700}
.hero .focus{font-size:19px;font-weight:500;line-height:1.2}
.hero .meta{font-size:13px;color:var(--txt-2);margin-top:3px}
.hero .eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--txt-3);margin-bottom:12px}
.btn-start{display:block;width:100%;margin-top:18px;min-height:50px;border-radius:100px;
  background:var(--accent);color:#fff;font-weight:500;font-size:15px;box-shadow:var(--e1)}
.btn-start:active{filter:brightness(.92)}
.btn-start.resume{background:var(--amber-btn)}

/* ---- readiness chips ---- */
.sec-h{font-size:13px;font-weight:500;color:var(--txt-2);margin:22px 0 10px}
.ready{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chip{background:var(--surface);border-radius:12px;padding:10px 11px;box-shadow:var(--e1)}
.chip .g{font-size:11px;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .d{font-family:var(--mono);font-size:17px;font-weight:500;margin-top:2px;color:var(--txt)}
/* over = past the window, ready = inside it, rest = still recovering.
   "rest" is deliberately uncoloured: nothing is wrong and nothing is due, so
   it should not compete with the groups that are actually asking for work. */
.chip.over{background:var(--red-c)}    .chip.over .d{color:var(--red-on)}    .chip.over .g{color:var(--red-on)}
.chip.ready{background:var(--green-c)} .chip.ready .d{color:var(--green-on)} .chip.ready .g{color:var(--green-on)}
.chip.rest{background:var(--surface)}  .chip.rest .d{color:var(--txt-2)}
.chip.none .d{color:var(--txt-3)}

/* ---- exercise cards (Drive-style rows) ---- */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--e1);margin-bottom:10px;overflow:hidden}
.card.open{box-shadow:var(--e2)}
.card.done{background:var(--surface-2);box-shadow:none}
.chead{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;min-height:var(--tap)}
.rtile{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:var(--surface-2);color:var(--txt-2);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:500}
.card.open .rtile{background:var(--accent-c);color:var(--accent)}
.card.done .rtile{background:var(--green-c);color:var(--green-on)}
.cname{flex:1;min-width:0}
.cname .n{font-size:15px;font-weight:500;line-height:1.25}
.cname .r{font-size:12px;color:var(--txt-2);margin-top:3px;display:block;font-family:var(--mono)}
.cname .r b{color:var(--blue);font-weight:600}
.badge{font-size:10px;font-weight:600;letter-spacing:.04em;padding:4px 9px;border-radius:100px;
  background:var(--amber-c);color:var(--amber-on)}
.badge.ok{background:var(--green-c);color:var(--green-on)}

.cbody{border-top:1px solid var(--outline-soft);padding:16px}
.bump{background:var(--amber-c);border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:13px;line-height:1.5;color:var(--amber-on)}
.bump b{font-family:var(--mono);font-weight:700}
.lastline{display:flex;justify-content:space-between;font-size:12px;color:var(--txt-2);margin-bottom:3px}
.lastline b{color:var(--txt);font-family:var(--mono);font-weight:500}
.targline{font-family:var(--mono);font-size:17px;font-weight:500;color:var(--blue);margin-bottom:12px}

/* rep track */
.track{position:relative;height:34px;background:var(--surface-2);border-radius:100px;overflow:hidden}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--blue-c);
  border-right:3px solid var(--blue);transition:width .16s ease-out}
.track.hit .fill{background:var(--amber-c);border-right-color:var(--amber)}
.track .tgt{position:absolute;top:6px;bottom:6px;width:2px;background:var(--amber);border-radius:2px}
.track .tgt::after{content:attr(data-l);position:absolute;top:50%;transform:translateY(-50%);left:6px;
  font-family:var(--mono);font-size:10px;font-weight:600;color:var(--amber-on);white-space:nowrap}
.track .lo,.track .hi{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:10px;color:var(--txt-3)}
.track .lo{left:11px} .track .hi{right:11px}
.track .val{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:13px;font-weight:600;color:var(--txt)}
/* Past-failure count. Appears only once a technique is picked, and reads as
   an addendum to the reps above rather than a second rep field. */
.ext{margin-top:10px;padding:11px 13px;border-radius:12px;background:var(--amber-c)}
.ext .lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--amber-on)}
.ext .ctl{display:flex;align-items:center;gap:8px;margin-top:7px}
.ext .ctl button{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--surface);
  color:var(--amber-on);font-size:19px;line-height:1;box-shadow:var(--e1)}
.ext .ctl input{width:56px;flex:0 0 56px;background:transparent;border:none;text-align:center;
  font-family:var(--mono);font-size:22px;font-weight:600;color:var(--amber-on);padding:0}
.ext .ctl input:focus{outline:none}
.ext .u{font-size:12px;color:var(--amber-on);opacity:.85}
.ext .hint{font-size:11px;line-height:1.45;color:var(--amber-on);opacity:.8;margin-top:7px}

.cap{font-size:12px;color:var(--txt-2);margin-top:8px;min-height:32px;line-height:1.4}
.cap.good{color:var(--green-on)} .cap.top{color:var(--amber-on);font-weight:500}

/* steppers */
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.st{background:var(--surface-2);border-radius:14px;padding:10px}
.st .lbl{font-size:11px;font-weight:500;color:var(--txt-2);text-align:center}
.st .ctl{display:flex;align-items:center;gap:4px;margin-top:6px}
.st button{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:var(--surface);
  color:var(--blue);font-size:22px;line-height:1;box-shadow:var(--e1)}
.st button:active{background:var(--blue-c)}
.st input{flex:1;min-width:0;width:100%;background:transparent;border:none;text-align:center;
  font-family:var(--mono);font-size:26px;font-weight:500;color:var(--txt);padding:0}
.st input:focus{outline:none;color:var(--blue)}
.unit{font-size:11px;color:var(--txt-3);text-align:center;margin-top:4px;min-height:14px}

.fail-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.fail-row button{min-height:36px;border-radius:100px;border:1px solid var(--outline);
  font-size:11px;color:var(--txt-2);background:var(--surface)}
.fail-row button[aria-pressed="true"]{border-color:var(--green);background:var(--green-c);color:var(--green-on);font-weight:500}
.note-in{width:100%;margin-top:12px;background:var(--surface-2);border:1px solid transparent;
  border-radius:12px;padding:12px;color:var(--txt);font-size:14px;resize:none}
.note-in:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.btn-log{width:100%;margin-top:14px;min-height:50px;border-radius:100px;background:var(--blue);
  color:#fff;font-weight:500;font-size:15px;box-shadow:var(--e1)}
.btn-log:active{filter:brightness(.92)}
.btn-log.top{background:var(--amber-btn)}
.mini-row{display:flex;gap:8px;margin-top:10px}
.mini{flex:1;min-height:40px;border-radius:100px;border:1px solid var(--outline);background:var(--surface);
  font-size:12px;color:var(--blue)}
.mini:active{background:var(--blue-c)}
.mini.warn{color:var(--red)} .mini.warn:active{background:var(--red-c)}
.addbar{width:100%;min-height:48px;border-radius:100px;border:1px dashed var(--outline);background:transparent;
  font-size:13px;color:var(--blue);margin-top:6px;font-weight:500}
.addbar:active{background:var(--blue-c)}

/* ---- bottom nav (M3 pill indicator) ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);
  border-top:1px solid var(--outline-soft);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.nav button{flex:1;min-height:56px;font-size:11px;font-weight:500;color:var(--txt-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.nav button .ic{width:60px;height:32px;border-radius:100px;display:flex;align-items:center;justify-content:center;
  transition:background .15s}
.nav button .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--blue)}
.nav button[aria-current="page"] .ic{background:var(--blue-c)}

/* ---- history / records / program ---- */
.sess{background:var(--surface);border-radius:var(--r);box-shadow:var(--e1);margin-bottom:10px;overflow:hidden}
.sess .sh{display:flex;align-items:center;gap:14px;padding:14px 16px;width:100%;text-align:left;min-height:var(--tap)}
.sess .wl{width:40px;height:40px;flex:0 0 40px;border-radius:10px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:16px}
/* wl colors applied inline via wlStyle() */
.sess .sd{flex:1}
.sess .sd .dt{font-size:15px;font-weight:500}
.sess .sd .mm{font-size:12px;color:var(--txt-2);margin-top:2px}
.sess .body{border-top:1px solid var(--outline-soft);padding:6px 16px 14px}
.set{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--outline-soft);font-size:14px}
.set:last-child{border-bottom:none}
.set .sn{flex:1;min-width:0}
.set .sv{font-family:var(--mono);font-size:13px;color:var(--txt-2);white-space:nowrap}
.set .se{font-family:var(--mono);font-size:12px;color:var(--txt-3);width:46px;text-align:right}
/* Submaximal by prescription - a statement of fact, not a shortfall. */
.set .se.sub{width:56px;font-size:11px;color:var(--blue)}
.set-note{font-size:12px;color:var(--txt-3);padding:0 0 9px;font-style:italic}

.panel{background:var(--surface);border-radius:var(--r);box-shadow:var(--e1);padding:18px;margin-bottom:12px}
.panel h3{margin:0 0 5px;font-size:15px;font-weight:500;color:var(--txt)}
.panel p{margin:0 0 14px;font-size:13px;color:var(--txt-2);line-height:1.55}

/* Instance switcher. A select, not a row of pills - the number of programs is
   unbounded and a wall of them buries the program you came to look at. */
.isel{width:100%;min-height:46px;margin-bottom:10px;padding:0 36px 0 14px;
  border:1px solid var(--outline);border-radius:12px;background:var(--surface-2);
  color:var(--txt);font-size:14px;font-weight:500;
  -webkit-appearance:none;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%235f6368'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center}

/* Quiet source/attribution note. Deliberately not .bump — that is the amber
   PR alert and shouting a citation in warning colours reads as an error. */
.cite{border-left:3px solid var(--outline);padding:2px 0 2px 12px;margin-bottom:14px;
  font-size:12px;line-height:1.55;color:var(--txt-3)}
.cite b{color:var(--txt-2);font-weight:600}

/* Template-drift notice */
.stale{background:var(--blue-c);border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:12.5px;line-height:1.5;color:var(--blue-on)}
.stale .btn-o{margin-top:10px;background:var(--surface);border-color:var(--blue)}

/* "How it runs" spec rows */
.runs{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.runs .r{display:flex;gap:12px;font-size:12.5px;line-height:1.5}
.runs .k{flex:0 0 96px;color:var(--txt-3)}
.runs .v{flex:1;color:var(--txt-2)}

/* Template cards. Previously emitted with class="opt", which is only styled
   as a descendant of .picker, so outside one they rendered as bare text. */
.tpl{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border-radius:14px;
  border:1px solid var(--outline);background:var(--surface-2);color:var(--txt)}
.tpl:active{background:var(--blue-c);border-color:var(--blue)}
.tpl .n{font-size:14px;font-weight:500}
.tpl .m{display:block;font-family:var(--mono);font-size:11px;color:var(--txt-3);margin-top:3px}
.tpl .b{display:block;font-size:12px;color:var(--txt-2);line-height:1.5;margin-top:6px}
/* Group heading in the template picker. */
.tplg{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--txt-3);margin:18px 0 8px;padding-top:14px;border-top:1px solid var(--outline-soft)}
.tpl + .tplg{margin-top:16px}
.tpl .nx{display:block;font-size:11px;color:var(--blue);margin-top:6px}
.tpl.cur{border-color:var(--accent);background:var(--accent-c)}
.tpl.cur .n{color:var(--accent-on)} .tpl.cur .m,.tpl.cur .b{color:var(--accent-on);opacity:.85}
.tpl.cur .nx{color:var(--accent-on);opacity:.9}

/* Add-to-home-screen instructions, iOS only. */
.howto{background:var(--blue-c);border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:12.5px;line-height:1.5;color:var(--blue-on)}
.howto b{font-weight:600}
.howto ol{margin:8px 0 0;padding-left:20px}
.howto li{margin-bottom:5px}
.howto .q{display:block;margin-top:9px;font-size:11px;opacity:.8}

/* Where a break-in leads next. An offer, never automatic. */
.next{background:var(--blue-c);border-radius:12px;padding:12px 14px;margin-bottom:14px;
  font-size:12.5px;line-height:1.5;color:var(--blue-on)}
.next .btn-o{margin-top:10px;background:var(--surface);border-color:var(--blue)}
.btn-o{width:100%;min-height:46px;border-radius:100px;border:1px solid var(--outline);background:var(--surface);
  font-size:14px;color:var(--blue);margin-bottom:9px;font-weight:500}
.btn-o:active{background:var(--blue-c)}
.btn-o.danger{color:var(--red)} .btn-o.danger:active{background:var(--red-c)}

.wo-edit{border-radius:14px;background:var(--surface-2);margin-bottom:10px;overflow:hidden}
.wo-edit>.h{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:52px}
.wo-edit>.h .l{width:34px;height:34px;flex:0 0 34px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:15px}
/* .l colors applied inline via wlStyle() */
.wo-edit>.h .t{flex:1;font-size:14px;font-weight:500}
.wo-edit>.h .c{font-size:12px;color:var(--txt-3)}
.wo-edit .list{background:var(--surface);padding:8px 14px 14px}
.erow{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--outline-soft)}
.erow:last-of-type{border-bottom:none}
.erow .en{flex:1;min-width:0;font-size:14px}
.erow .en small{display:block;font-size:11px;color:var(--txt-3);margin-top:2px}
.erow .mv,.erow .rm{width:34px;height:34px;flex:0 0 34px;border-radius:50%;font-size:14px}
.erow .mv{color:var(--txt-2)} .erow .mv:active{background:var(--surface-2)}
.erow .mv[disabled]{opacity:.3}
.erow .rm{color:var(--red)} .erow .rm:active{background:var(--red-c)}

.picker{background:var(--surface-2);border-radius:14px;padding:12px;margin-top:10px}
.picker .ph{font-size:12px;font-weight:500;color:var(--txt-2);margin-bottom:10px}
.picker .opt{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--surface);
  margin-bottom:7px;font-size:14px;min-height:46px;box-shadow:var(--e1)}
.picker .opt:active{background:var(--blue-c);color:var(--blue-on)}
.picker .opt small{display:block;font-size:11px;color:var(--txt-3);margin-top:2px}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.frm .full{grid-column:1/-1}
.frm label{display:block;font-size:11px;font-weight:500;color:var(--txt-2);margin-bottom:5px}
.frm input,.frm select{width:100%;min-height:46px;background:var(--surface);border:1px solid var(--outline);
  border-radius:10px;padding:0 12px;color:var(--txt);font-size:15px}
.frm input:focus,.frm select:focus{outline:none;border-color:var(--blue);border-width:2px}

.prtab{width:100%;border-collapse:collapse;font-size:13px}
.prtab th{font-size:11px;font-weight:500;color:var(--txt-3);text-align:left;padding:0 0 9px}
.prtab th.r,.prtab td.r{text-align:right}
.prtab td{padding:10px 0;border-top:1px solid var(--outline-soft)}
.prtab td.n{max-width:150px}
.prtab td.v{font-family:var(--mono);color:var(--txt-2);font-size:12px}
.prtab td.e{font-family:var(--mono);font-weight:600;color:var(--blue)}

.empty{text-align:center;padding:56px 22px;color:var(--txt-3)}
.empty .big{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--txt-3)}
.empty p{font-size:14px;margin:0;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:#323232;color:#fff;padding:13px 20px;border-radius:100px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .2s;z-index:50;white-space:nowrap;box-shadow:var(--e2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.gold{background:var(--amber-btn)}
.hide{display:none!important}
</style>
</head>

/* Palette-based accent: position in the rotation picks the color. */
var WPALETTE = [
  {a:"var(--blue)",  c:"var(--blue-c)",  o:"var(--blue-on)"},
  {a:"var(--green)", c:"var(--green-c)", o:"var(--green-on)"},
  {a:"var(--red)",   c:"var(--red-c)",   o:"var(--red-on)"},
  {a:"var(--amber)", c:"var(--amber-c)", o:"var(--amber-on)"}
];
function wtheme(code, instId){
  var rot = (instId && S.instances[instId] && S.instances[instId].rotation) || rotation();
  var idx = rot.indexOf(code);
  if(idx < 0) idx = 0;
  return WPALETTE[idx % WPALETTE.length];
}
function wlStyle(code, instId){
  var t = wtheme(code, instId);
  return 'background:'+t.c+';color:'+t.a;
}
function setAccent(code){
  var t = wtheme(code), r = document.documentElement.style;
  r.setProperty("--accent", t.a); r.setProperty("--accent-c", t.c); r.setProperty("--accent-on", t.o);
}

   follows its load, so the back-off never earns a weight jump on its own. */

  var since = lastOf ? daysBetween(lastOf.date, today()) : null;

  var gw = groupWindow(), sw = sessionWindow();

  var groups = [], seen = {};
  var A = allEx(); for(var k in A){ if(!seen[A[k].g]){ seen[A[k].g] = 1; groups.push(A[k].g); } }
  var chips = groups.map(function(g){
    var ld = lastGroupDate(g), n = ld ? daysBetween(ld, today()) : null;
    return '<div class="chip '+windowState(n, gw)+'"><div class="g">'+esc(g)+'</div>'
         + '<div class="d">'+(n === null ? "&mdash;" : n+"d")+'</div></div>';
  }).join("");

  /* Session clock: how long since the last workout of any code. Same reading
     as the chips - inside the window is the good state - just a different
     window, so both go through windowState. */
  var lastAny = lastSessionDate();
  var gap = lastAny ? daysBetween(lastAny, today()) : null;
  var gs = windowState(gap, sw);
  var due, dueCls = "";
  if(gap === null) due = "First workout of this program";
  else if(gs === "rest") due = "Rested "+gap+"d &middot; next due in "+(sw[0]-gap)+"d";
  else if(gs === "ready"){ due = "Rested "+gap+"d &middot; inside the "+winText(sw)+" window"; dueCls = "ready"; }
  else { due = "Rested "+gap+"d &middot; past the "+winText(sw)+" window"; dueCls = "late"; }

  return '<div class="seg-h">Today I am doing</div>'
    + '<div class="seg">' + rotation().map(function(c){
        return '<button aria-pressed="'+(c === code)+'" onclick="pick=\''+c+'\';render()">'
             + '<span class="l">'+c+'</span><span class="f">'+esc(focusOf(c))+'</span></button>'; }).join("") + '</div>'
    + '<section class="hero">'
    + '<div class="eyebrow">'+(code === auto.code ? "Next in rotation" : "Out of rotation")+'</div>'
    + '<div class="rowtop"><div class="tile">'+code+'</div><div style="flex:1">'
    + '<div class="focus">'+esc(focusOf(code))+'</div>'
    + '<div class="meta">'+(since === null ? "not yet logged" : since+"d since "+code+" &middot; comes around every "+winText(gw))+'</div>'
    + '<div class="meta">'+resolveList(code, cycle).length+' exercises</div>'
    + '</div></div>'
    + '<div class="dueline '+dueCls+'">'+due+'</div>'
    + '<button class="btn-start" onclick="startSession(\''+code+'\','+cycle+')">Start workout '+code+'</button></section>'
    + '<div class="sec-h">Days since trained &middot; target '+winText(gw)+'</div>'
    + '<div class="ready">'+chips+'</div>';
}

function viewSession(d){
  var cards = d.order.map(function(id, i){ return card(d, id, i); }).join("");
  var remaining = d.order.filter(function(id){ return slotsLogged(d, id) < slotSetsNeeded(d, id); }).length;
  var A = allEx();
  var pool = Object.keys(A).filter(function(x){ return d.order.indexOf(x) === -1; });
  return '<section class="hero"><div class="eyebrow">In progress &middot; '+fmtDate(d.date)+'</div>'
    + '<div class="rowtop"><div class="tile">'+d.workout+'</div><div style="flex:1">'
    + '<div class="focus">'+esc(focusOf(d.workout))+'</div>'
    + '<div class="meta">'+d.sets.length+' set'+(d.sets.length === 1 ? "" : "s")+' logged &middot; '+remaining+' to go</div></div></div>'
    + '<div style="display:flex;align-items:center;gap:8px;margin-top:12px"><span style="font-size:13px;color:var(--txt-2)">Bodyweight</span>'
    + '<input type="number" inputmode="decimal" placeholder="lb" style="width:80px;min-height:38px;background:var(--surface-2);border:1px solid var(--outline);border-radius:10px;padding:0 10px;font-family:var(--mono);font-size:15px;color:var(--txt)" value="'+(d.bodyweight || '')+'" oninput="setBW(this.value)"></div>'
    + '<button class="btn-start resume" onclick="finishSession()">'+(d.sets.length ? "Finish and save session" : "Cancel session")+'</button></section>'
    + cards
    + (adding
      ? '<div class="picker"><div class="ph">Add to today only</div>'
        + (pool.map(function(x){ return '<button class="opt" onclick="addToday(\''+x+'\')">'+esc(A[x].n)
            + '<small>'+esc(A[x].g)+' &middot; '+esc(A[x].rr)+' reps</small></button>'; }).join("")
            || '<div class="cap">Everything is already in this session.</div>')
        + '<button class="mini" onclick="adding=false;render()">Cancel</button></div>'
      : '<button class="addbar" onclick="adding=true;render()">+ Add exercise</button>');
}

function card(d, id, i){
  var e = exOf(id); if(!e) return "";
  var logged = d.sets.filter(function(s){ return s.ex === id; });
  var needed = slotSetsNeeded(d, id);
  var allDone = logged.length >= needed;
  var partialDone = logged.length > 0 && !allDone;
  var isOpen = open_ === id || partialDone;
  /* Range for the set being entered now, not the library default. */
  var setNum = logged.length;
  var rrText = activeRR(id, setNum);
  var r = activeRange(id, setNum), lo = r[0], hi = r[1];

  if(allDone && open_ !== id){
    var topSet = logged.filter(function(s){ return !s.role || s.role === "top"; })[0] || logged[0];
    var sew = topSet.endedWith || "clean";
    /* The TOP badge judges the top set, so use the top set's range - setNum
       has already run past the end by the time every set is logged. */
    var topHi = activeRange(id, 0)[1];
    var summ = logged.length > 1
      ? logged.map(function(s){ return setText(e, s.reps, s.weight, s.extra); }).join(' / ')
      : setText(e, topSet.reps, topSet.weight, topSet.extra)
        + (!topSet.scheme && sew !== "clean" ? ' · '+sew : '');
    return '<article class="card done"><button class="chead" onclick="toggle(\''+id+'\')">'
      + '<span class="rtile">&#10003;</span><span class="cname"><span class="n">'+esc(e.n)+'</span>'
      + '<span class="r">'+summ+'</span></span>'
      /* A submaximal set has no "top of range" to hit - reaching the prescribed
         count is the whole job, not a personal best. */
      + (!topSet.scheme && sew === "clean" && topSet.reps >= topHi
          ? '<span class="badge">TOP</span>' : '<span class="badge ok">DONE</span>')
      + '</button></article>';
  }

  /* Break-in sets prescribe nothing, so there is no target to compute or show
     and targetFor is never consulted for them. */
  var spec = setSpec(d, id, setNum);
  var submax = isSubmax(spec);
  /* Two separate gates. `prescribes` decides whether targetFor is consulted at
     all (section 3: never for progression "none"). `plain` decides how the set
     is presented - a submaximal set shows a prescription with no rep track and
     nothing to chase, even when it derives its load from the set before it. */
  var prescribes = !spec || spec.progression !== "none";
  var plain = submax || !prescribes;
  var t = prescribes ? targetFor(id) : null;

  if(!isOpen){
    var lk = plain ? lastKnown(id) : null;
    return '<article class="card"><button class="chead" onclick="toggle(\''+id+'\')">'
      + '<span class="rtile">'+(i+1)+'</span><span class="cname"><span class="n">'+esc(e.n)+'</span><span class="r">'
      + (!plain
          ? (t.pr ? 'last '+(t.last ? setText(e, t.last.reps, t.last.weight) : '&mdash;')+' &rarr; ' : '')
            + '<b>'+(t.weight === null ? (t.bwEx ? t.reps+' reps' : 'set baseline') : setText(e, t.reps, t.weight))+'</b>'
          : '<b>'+lo+' reps</b>, comfortable'
            + (lk ? ' &middot; last '+setText(e, lk.reps, lk.weight) : ''))
      + '</span></span></button></article>';
  }

  var st = entryFor(id);
  var reps = Number(st.reps) || 0, wt = Number(st.weight) || 0;
  var span = (Math.max(hi, reps) - lo) || 1;
  var pctOf = function(v){ return Math.max(0, Math.min(100, (v - lo) / span * 100)); };
  /* "Top of range" is a progression signal. A set prescribed to stop short has
     no top to reach, so it never lights up. */
  var atTop = !plain && reps >= hi;
  var partner = altPartner(d.workout, d.cycle, id);

  var sameLastPR = t && t.last && t.pr && t.last.reps === t.pr.reps && t.last.weight === t.pr.weight && t.last.date === t.pr.date;

  var cap, capCls = "";
  var pct = spec && spec.loadFactor ? Math.round(spec.loadFactor * 100) : null;
  if(plain){
    cap = "Stop at "+lo+". This set is meant to feel comfortable - going to failure here works against you.";
  }
  /* A back-off set is taken to failure too, but its load is derived from the
     top set, so it never earns a weight jump of its own. Without this branch
     it fell through to "top of the range" and promised a bump on 90% of the
     working weight - a number that will never be used. */
  else if(st.role === "working"){
    cap = "Also to failure"+(pct ? ", at "+pct+"% of your top set" : "")
        + ". The load follows set 1, so this set does not move the target.";
  }
  else if(!t.pr){ cap = "No history - this set becomes the baseline."; }
  else if(t.bwEx){ cap = "Bodyweight exercise - add a load only if you use one."; }
  else if(reps < t.reps){ cap = (t.reps - reps)+" short of your PR: "+setText(e, t.pr.reps, t.pr.weight)+"."; }
  else if(atTop){ cap = "Top of the range. Next session goes to "+bumpWeight(wt, e)+" lb."; capCls = "top"; }
  else if(reps === t.reps){ cap = "On target - beats your PR. "+(hi - reps)+" more earns the next weight jump."; capCls = "good"; }
  else { cap = "+"+(reps - t.reps)+" over target. "+(hi - reps)+" more earns the next weight jump."; capCls = "good"; }

  /* Last / PR / Target lines. A break-in set has no PR to chase, so it shows
     only what was last lifted. */
  var infoLines = '';
  if(plain){
    var plk = lastKnown(id);
    infoLines = '<div class="lastline"><span>Last: <b>'
      + (plk ? setText(e, plk.reps, plk.weight) : '&mdash;')+'</b></span><span>'
      + (plk ? fmtDate(plk.date) : '')+'</span></div>';
  } else if(!t.pr){
    infoLines = '<div class="lastline"><span>Last: <b>&mdash;</b></span><span></span></div>';
  } else if(sameLastPR){
    infoLines = '<div class="lastline"><span>Last / PR: <b>'+setText(e, t.pr.reps, t.pr.weight)+'</b></span><span>'
      + (t.pr.seeded ? 'archived ' : '')+fmtDate(t.pr.date)+'</span></div>';
  } else {
    infoLines = '<div class="lastline"><span>Last: <b>'
      + (t.last ? setText(e, t.last.reps, t.last.weight) : '&mdash;')+'</b></span><span>'
      + (t.last ? fmtDate(t.last.date) : '')+'</span></div>'
      + '<div class="lastline"><span>PR: <b>'+setText(e, t.pr.reps, t.pr.weight)+'</b></span><span>'
      + (t.pr.seeded ? 'archived ' : '')+fmtDate(t.pr.date)+'</span></div>';
  }

  /* Multi-set: show logged sets for partial progress */
  var loggedHtml = '';
  if(logged.length > 0){
    loggedHtml = logged.map(function(s,si){
      return '<div class="lastline"><span>Set '+(si+1)+': <b>'+setText(e, s.reps, s.weight)+'</b>'
        +(s.extra ? ' <b>+'+s.extra+'</b> '+esc(endedWithDef(s.endedWith).unit)
          : s.endedWith && s.endedWith !== "clean" ? ' ('+s.endedWith+')' : '')
        +'</span><span>&#10003;</span></div>';
    }).join("");
  }
  var setLabel = needed > 1 ? '<div class="targline" style="font-size:13px;color:var(--txt-2)">Set '+(logged.length+1)+' of '+needed
    +(st.role === "working" ? ' &middot; working set' : ' &middot; top set')+'</div>' : '';

  return '<article class="card open"><button class="chead" onclick="toggle(\''+id+'\')">'
    + '<span class="rtile">'+(i+1)+'</span><span class="cname"><span class="n">'+esc(e.n)+'</span>'
    + '<span class="r">'+esc(rrLabel(rrText))+' reps &middot; '+esc(e.unit)+'</span></span></button>'
    + '<div class="cbody">'
    + loggedHtml + setLabel
    + (!plain && t.bumped && !partialDone ? '<div class="bump">You hit <b>'+t.pr.reps+'</b> reps at your PR - top of the '+esc(activeRR(id, 0))
        + ' range. Weight moves <b>'+t.pr.weight+' &rarr; '+t.weight+'</b>, reps reset to <b>'+lo+'</b>.</div>' : '')
    + (st.role !== "working" ? infoLines : '')
    /* Prescription, not a target. A rep track would invite pushing past it,
       and with a single-value range it cannot render meaningfully anyway. */
    + (!plain
        ? (st.role === "working"
            /* Weight is prescribed, reps are not - you take it as far as the
               lighter load allows, which is the whole point of the set. */
            ? '<div class="targline">'+st.weight+suffix(e)
              +(pct ? ' &middot; '+pct+'% of set 1' : '')+' &middot; to failure</div>'
            : '<div class="targline">Target: '
              +(t.weight === null ? (t.bwEx ? t.reps+' reps' : 'your call') : setText(e, t.reps, t.weight))+'</div>')
          + '<div class="track'+(atTop ? ' hit' : '')+'">'
          + '<div class="fill" style="width:'+pctOf(reps)+'%"></div>'
          + '<div class="tgt" style="left:'+pctOf(t.reps)+'%" data-l="'+t.reps+'"></div>'
          + '<span class="lo">'+lo+'</span><span class="hi">'+hi+'</span><span class="val">'+reps+' reps</span></div>'
        : '<div class="targline">'+lo+' reps'
          + (st.role === "working" ? ' at '+st.weight+suffix(e)+' &middot; 10% up on set 1' : '')
          + ' &middot; not to failure</div>')
    + '<div class="cap '+capCls+'">'+cap+'</div>'
    + '<div class="steppers">'
    + '<div class="st"><div class="lbl">Weight</div><div class="ctl">'
    + '<button onclick="bump(\''+id+'\',\'weight\',-'+e.step+')" aria-label="less weight">&minus;</button>'
    + '<input type="number" inputmode="decimal" value="'+st.weight+'" placeholder="&mdash;" oninput="setv(\''+id+'\',\'weight\',this.value)">'
    + '<button onclick="bump(\''+id+'\',\'weight\','+e.step+')" aria-label="more weight">+</button>'
    + '</div><div class="unit">'+esc(e.unit)+'</div></div>'
    + '<div class="st"><div class="lbl">Reps</div><div class="ctl">'
    + '<button onclick="bump(\''+id+'\',\'reps\',-1)" aria-label="fewer reps">&minus;</button>'
    + '<input type="number" inputmode="numeric" value="'+st.reps+'" oninput="setv(\''+id+'\',\'reps\',this.value)">'
    + '<button onclick="bump(\''+id+'\',\'reps\',1)" aria-label="more reps">+</button>'
    + '</div><div class="unit">'+(plain ? 'aim for ' : 'range ')+esc(rrLabel(rrText))+'</div></div></div>'
    /* No ending to report on a set prescribed to stop short of failure, so the
       control is not offered. Submaximal is a property of the prescription,
       fixed before the bar moved, not something to observe afterwards. */
    + (submax ? '' : '<div class="fail-row">' + ENDED_WITH.map(function(ew){
        return '<button aria-pressed="'+(st.endedWith === ew.v)+'" onclick="setv(\''+id+'\',\'endedWith\',\''+ew.v+'\')">'
             + ew.l+'</button>'; }).join("") + '</div>')
    /* Extra count, only once a past-failure technique is chosen. The reps
       above stay the clean reps and keep driving progression. */
    + (isExtended(st.endedWith)
      ? '<div class="ext"><div class="lbl">Past failure</div><div class="ctl">'
        + '<button onclick="bump(\''+id+'\',\'extra\',-1)" aria-label="fewer">&minus;</button>'
        + '<input type="number" inputmode="numeric" value="'+(st.extra || 0)+'" oninput="setv(\''+id+'\',\'extra\',this.value)">'
        + '<button onclick="bump(\''+id+'\',\'extra\',1)" aria-label="more">+</button>'
        + '<span class="u">'+esc(endedWithDef(st.endedWith).unit)+'</span></div>'
        + '<div class="hint">'+st.reps+' clean to failure, then '+(st.extra || 0)+'. '
        + 'The '+st.reps+' is what sets your PR and moves the target.</div></div>'
      : '')
    + '<textarea class="note-in" rows="2" placeholder="'+(e.warn ? esc(e.warn) : "Notes")+'" oninput="setv(\''+id+'\',\'note\',this.value)">'+esc(st.note)+'</textarea>'
    + '<button class="btn-log'+(atTop && st.role !== "working" ? ' top' : '')+'" onclick="commit(\''+id+'\')">'
    +(needed > 1 ? 'Log set '+(logged.length+1)+' of '+needed : atTop ? "Log - top of range" : "Log set")+'</button>'
    + '<div class="mini-row">'
    + (partner ? '<button class="mini" onclick="swapAlt(\''+id+'\',\''+partner+'\')">Swap to '+esc(exOf(partner).n)+'</button>' : '')
    + '<button class="mini warn" onclick="dropToday(\''+id+'\')">Remove from today</button></div>'
    + '</div></article>';
}

/* ============================================================ HISTORY / RECORDS */
function viewHistory(){
  if(!S.sessions.length) return empty("&#8801;", "No sessions yet.<br>Your first workout shows up here.");
  var rev = S.sessions.slice().reverse();
  return rev.map(function(s, i){
    /* Gap compares like with like: the same code inside the same program.
       Workout A of one program and workout A of another are not the same
       session recurring. */
    var prev = rev.slice(i+1).filter(function(x){
      return x.workout === s.workout && x.instance === s.instance; })[0];
    var gap = prev ? daysBetween(prev.date, s.date) : null;
    var focus = focusOf(s.workout, s.instance);
    var from = s.instance && s.instance !== S.active && S.instances[s.instance]
      ? S.instances[s.instance].name : null;
    return '<article class="sess"><button class="sh" onclick="this.parentNode.querySelector(\'.body\').classList.toggle(\'hide\')">'
      + '<span class="wl" style="'+wlStyle(s.workout, s.instance)+'">'+s.workout+'</span><span class="sd"><span class="dt">'+fmtDate(s.date)+'</span>'
      + '<span class="mm">'+(focus ? esc(focus)+' &middot; ' : '')+s.sets.length+' sets'
      + (gap !== null ? ' &middot; '+gap+'d gap' : '')
      + (from ? ' &middot; '+esc(from) : '')+'</span></span></button>'
      + '<div class="body'+(i === 0 ? '' : ' hide')+'">'
      + s.sets.map(function(x){ var e = exOf(x.ex);
          /* A submaximal set has no ending. Without this guard the fallback
             below reads its missing endedWith as "short" and badges it as a
             set the trainee quit early - the opposite of what happened. */
          var sub = x.scheme === "submax";
          var ew = sub ? "" : (x.endedWith || (x.failure === "Yes" ? "clean" : "short"));
          return '<div class="set"><span class="sn">'+esc(e ? e.n : x.ex)+'</span>'
            + '<span class="sv">'+setText(e, x.reps, x.weight, x.extra)+'</span>'
            + (sub ? '<span class="se sub">submax</span>'
               : ew !== "clean" ? '<span class="se">'+esc(ew)+'</span>' : '')+'</div>'
            + (x.note ? '<div class="set-note">'+esc(x.note)+'</div>' : ''); }).join("")
      + '</div></article>';
  }).join("");
}

function viewRecords(){
  var A = allEx();
  var rows = Object.keys(A).map(function(id){
    var b = bestFor(id), t = targetFor(id), l = lastKnown(id);
    return {e:A[id], b:b, t:t, since: l ? daysBetween(l.date, today()) : null};
  }).sort(function(a,b){ return (b.since === null ? -1 : b.since) - (a.since === null ? -1 : a.since); });
  return '<div class="panel"><h3>Records and next targets</h3>'
    + '<p>Target comes from double progression: meet or beat the top of the rep range and the weight goes up one increment, reps reset to the bottom. Rows marked &middot; were seeded from the archived Excel log.</p>'
    + '<table class="prtab"><tr><th>Movement</th><th class="r">Best set</th><th class="r">Next target</th><th class="r">Ago</th></tr>'
    + rows.map(function(r){
        return '<tr><td class="n">'+esc(r.e.n)+(r.b && r.b.seeded ? ' <span style="color:var(--txt-3)">&middot;</span>' : '')+'</td>'
          + '<td class="v r">'+(r.b ? r.b.reps+' &times; '+r.b.weight : '&mdash;')+'</td>'
          + '<td class="e r">'+(r.t.weight === null ? '&mdash;' : r.t.reps+' &times; '+r.t.weight)+'</td>'
          + '<td class="v r">'+(r.since === null ? '&mdash;' : r.since+'d')+'</td></tr>'; }).join("")
    + '</table></div>';
}

/* ============================================================ PROGRAM */
function slotLabel(it){
  if(typeof it === "string"){ var e = exOf(it); return e ? e.n : it; }
  if(it.alt) return it.alt.map(function(x){ var e = exOf(x); return e ? e.n : x; }).join("  /  ");
  if(it.ex){ var e2 = exOf(it.ex); return e2 ? e2.n : it.ex; }
  return "?";
}
function slotSub(it){
  if(typeof it === "string"){ var e = exOf(it); return e ? e.g+" · "+e.rr+" reps" : "unknown"; }
  if(it.alt) return "alternates by cycle"+(it.sets && it.sets.length > 1 ? " · "+it.sets.length+" sets" : "");
  if(it.ex){ var e2 = exOf(it.ex); var extra = it.sets && it.sets.length > 1 ? " · "+it.sets.length+" sets" : "";
    var sub = it.sets && it.sets[0] && it.sets[0].scheme === "submax" ? " · not to failure" : "";
    return e2 ? e2.g+" · "+rrLabel(it.sets && it.sets[0] && it.sets[0].rr ? it.sets[0].rr : e2.rr)+" reps"+extra+sub : "unknown"; }
  return "";
}
function viewData(){
  var inst = S.instances[S.active];
  var rot = rotation();
  var tmpl = TEMPLATES[inst.source];
  var nSets = S.sessions.reduce(function(a,s){ return a + s.sets.length; }, 0);

  /* Instance switcher. A select rather than a row of pills: the count is
     unbounded, and twenty pills is a wall you have to scroll past to reach
     the program itself. */
  var instKeys = Object.keys(S.instances);
  var spares = instKeys.filter(function(k){ return k !== S.active && isSpare(k); }).length;
  var instPicker = "";
  if(instKeys.length > 1){
    instPicker = '<div class="panel"><h3>Program</h3>'
      + '<select class="isel" aria-label="Active program" onchange="switchInstance(this.value)">'
      + instKeys.map(function(k){
          var n = sessionsOf(k);
          return '<option value="'+k+'"'+(k === S.active ? ' selected' : '')+'>'
               + esc(S.instances[k].name)
               + (n ? ' — ' + n + ' session' + (n === 1 ? '' : 's') : S.instances[k].edited ? ' — edited' : '')
               + '</option>'; }).join("")
      + '</select>'
      + (spares
          ? '<button class="btn-o" onclick="pruneInstances()">Clear ' + spares
            + ' unused program' + (spares === 1 ? '' : 's') + '</button>'
          : '')
      + (isSpare(S.active)
          ? '<button class="btn-o danger" onclick="removeInstance(\''+S.active+'\')">Remove this program</button>'
          : '')
      + '</div>';
  }

  /* How this program runs: both rest clocks plus set structure. */
  function row(k, v){ return '<div class="r"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }
  var runs = '<div class="runs">'
    + row("Rotation", rot.length > 1
        ? rot.join(" &rarr; ")+" &middot; then back to "+rot[0]
        : rot[0]+" &middot; the same workout each time")
    + row("Between workouts", winText(sessionWindow()))
    + (rot.length > 1 ? row("Each returns", "every "+winText(groupWindow())) : "")
    + (tmpl && tmpl.structure ? row("Sets", esc(tmpl.structure)) : "")
    + '</div>';

  /* A break-in leads somewhere. Offered, never automatic - the book's trigger
     is whether soreness persists, which the app cannot see. */
  var nextTmpl = tmpl && tmpl.successor && TEMPLATES[tmpl.successor];
  var nextNote = nextTmpl
    ? '<div class="next"><span>When you are ready to move on: <b>'+esc(nextTmpl.name)+'</b></span>'
      + '<button class="btn-o" onclick="createInstance(\''+tmpl.successor+'\')">Start '+esc(nextTmpl.name)+'</button></div>'
    : '';

  var cite = tmpl
    ? '<div class="cite">'+(tmpl.adapted ? '<b>Adapted.</b> ' : '<b>As published.</b> ')+esc(tmpl.source)+'</div>'
    : '';

  /* A program is deep-copied from its template at creation, so later template
     changes do not reach copies already made. Flag the drift when the copy was
     never edited by hand - anything you changed yourself is left alone. */
  var stale = tmpl && !inst.edited
    && JSON.stringify(inst.program) !== JSON.stringify(tmpl.days);
  var staleNote = stale
    ? '<div class="stale">The '+esc(tmpl.name)+' template has changed since you started this copy.'
      + '<button class="btn-o" onclick="resetProgram()">Update to the current template</button></div>'
    : '';

  var progHtml = rot.map(function(c){
    var open = editWO === c, items = prog()[c].list;
    return '<div class="wo-edit"><button class="h" onclick="editWO='+(open ? 'null' : "'"+c+"'")+';addTo=null;newForm=false;render()">'
      + '<span class="l" style="'+wlStyle(c)+'">'+c+'</span><span class="t">'+esc(prog()[c].focus)+'</span>'
      + '<span class="c">'+items.length+' &middot; '+(open ? '&#9650;' : '&#9660;')+'</span></button>'
      + (open ? '<div class="list">'
        + (prog()[c].note ? '<div class="cite" style="margin:2px 0 12px">'+esc(prog()[c].note)+'</div>' : '')
        + items.map(function(it, i){
          return '<div class="erow"><span class="en">'+esc(slotLabel(it))+'<small>'+slotSub(it)+'</small></span>'
            + '<button class="mv" onclick="move(\''+c+'\','+i+',-1)" aria-label="move up"'+(i === 0 ? ' disabled' : '')+'>&uarr;</button>'
            + '<button class="mv" onclick="move(\''+c+'\','+i+',1)" aria-label="move down"'+(i === items.length-1 ? ' disabled' : '')+'>&darr;</button>'
            + '<button class="rm" onclick="removeEx(\''+c+'\','+i+')" aria-label="remove">&times;</button></div>';
        }).join("")
        + (addTo === c ? pickerFor(c) : '<button class="addbar" onclick="addTo=\''+c+'\';newForm=false;render()">+ Add exercise</button>')
        + '</div>' : '')
      + '</div>';
  }).join("");

  /* Template picker */
  function tplCard(tid, cur){
    var t = TEMPLATES[tid], nxt = t.successor && TEMPLATES[t.successor];
    return '<button class="tpl'+(cur ? ' cur' : '')+'" onclick="createInstance(\''+tid+'\')">'
      + '<span class="n">'+esc(t.name)+(cur ? ' &middot; current' : '')+'</span>'
      + '<span class="m">'+t.rotation.join("/")+' &middot; '+winText(t.rest.interSession)+' apart &middot; '
      + (t.adapted ? 'adapted' : 'as published')+'</span>'
      + '<span class="b">'+esc(t.blurb)+'</span>'
      + (nxt ? '<span class="nx">Leads to '+esc(nxt.name)+'</span>' : '')+'</button>';
  }
  /* The program you are on sits at the top, then the rest by set structure.
     It is omitted from its own group so it appears once, not twice. */
  var tplHtml = (TEMPLATES[inst.source] ? tplCard(inst.source, true) : '')
    + TPL_GROUPS.map(function(g){
        var ids = Object.keys(TEMPLATES).filter(function(tid){
          return tid !== inst.source && templateGroup(TEMPLATES[tid]) === g.key; });
        if(!ids.length) return '';
        return '<div class="tplg">'+g.label+'</div>' + ids.map(function(tid){ return tplCard(tid, false); }).join("");
      }).join("");

  return instPicker
    + '<div class="panel"><h3>'+esc(inst.name)+(inst.edited ? ' <span style="color:var(--txt-3);font-weight:400;font-size:12px">edited</span>' : '')+'</h3>'
    + (tmpl && tmpl.blurb ? '<p>'+esc(tmpl.blurb)+'</p>' : '')
    + runs + cite + nextNote + staleNote
    + '<p>Tap a workout to add, remove or reorder movements.</p>'
    + progHtml
    + '<button class="btn-o" onclick="resetProgram()">Reset to source template</button></div>'
    + '<div class="panel"><h3>Storage</h3><p>'
    + (HAS_LS
        ? 'Saved on this device. '+S.sessions.length+' session'+(S.sessions.length === 1 ? '' : 's')+', '+nSets+' sets. Nothing leaves your phone.'
        : '<strong style="color:var(--amber-on)">Preview mode - nothing persists.</strong> Deploy this file to a real URL and localStorage takes over.')
    + '</p>'
    /* One install block, three cases. iOS gets written instructions because
       Safari will never surface a prompt for us to hook. */
    + (isStandalone()
        ? '<p style="margin:-6px 0 12px;color:var(--green-on)">Installed and running from your home screen.</p>'
        : deferredPrompt
        ? '<button class="btn-o" style="border-color:var(--blue);background:var(--blue-c)" onclick="doInstall()">Install on this phone</button>'
        : isIOS()
        ? '<div class="howto"><b>Add to your home screen</b>'
          + (isIOSSafari()
              ? '<ol><li>Tap the Share button at the bottom of Safari &mdash; the square with an arrow out of it.</li>'
                + '<li>Scroll down the list and tap <b>Add to Home Screen</b>.</li>'
                + '<li>Tap <b>Add</b>. It opens full screen and works without signal.</li></ol>'
              : '<ol><li>Open this page in <b>Safari</b> &mdash; Add to Home Screen only appears in Safari\'s share menu.</li>'
                + '<li>Tap Share, then <b>Add to Home Screen</b>.</li></ol>')
          + '<span class="q">iPhone and iPad never show an install button. Adding it by hand is the only way, and it is the same result.</span></div>'
        : '')
    + '<button class="btn-o" onclick="exportJSON()">Export JSON</button>'
    + '<button class="btn-o" onclick="document.getElementById(\'imp\').click()">Import JSON</button>'
    + '<input type="file" id="imp" accept="application/json" class="hide" onchange="importJSON(this)">'
    + '<button class="btn-o" onclick="document.getElementById(\'blImp\').click()">Load baselines</button>'
    + '<input type="file" id="blImp" accept="application/json" class="hide" onchange="importBaselines(this)">'
    + '<button class="btn-o" onclick="exportBaselines()">Export baselines</button>'
    + '<button class="btn-o danger" onclick="wipe()">Erase all sessions</button></div>'
    + '<div class="panel"><h3>Start a new program</h3>'
    + '<p>Starts a fresh copy you can edit freely. Your current program and every logged session are kept &mdash; switch back any time.</p>'
    + tplHtml + '</div>';
}

function pickerFor(c){
  var A = allEx(), used = {};
  prog()[c].list.forEach(function(it){
    if(typeof it === "string") used[it] = 1;
    else if(it.alt) it.alt.forEach(function(x){ used[x] = 1; });
    else if(it.ex) used[it.ex] = 1;

      + '<div><label>Weight step</label><input id="nf_s" type="number" inputmode="decimal" value="5"></div>'
      + '<div><label>Bump %</label><input id="nf_p" type="number" inputmode="decimal" value="5"></div></div>'
      + '<div class="mini-row"><button class="mini" onclick="createEx(\''+c+'\')">Save exercise</button>'
      + '<button class="mini warn" onclick="newForm=false;render()">Cancel</button></div></div>';
  }
  return '<div class="picker"><div class="ph">Add to workout '+c+'</div>'
    + pool.map(function(x){ return '<button class="opt" onclick="addEx(\''+c+'\',\''+x+'\')">'+esc(A[x].n)
        + '<small>'+esc(A[x].g)+' &middot; '+esc(A[x].rr)+' reps</small></button>'; }).join("")
    + '<div class="mini-row"><button class="mini" onclick="newForm=true;render()">+ New exercise</button>'
    + '<button class="mini warn" onclick="addTo=null;render()">Cancel</button></div></div>';
}
function empty(b,m){ return '<div class="empty"><div class="big">'+b+'</div><p>'+m+'</p></div>'; }

/* ============================================================ ACTIONS */
function setBW(v){ if(S.draft){ S.draft.bodyweight = v === "" ? null : Number(v); save(); } }
function toggle(id){ open_ = open_ === id ? null : id; if(open_) entryFor(open_, true); render(); }
function setv(id,k,v){
  var st = entryFor(id);
  st[k] = (k === "note" || k === "endedWith") ? v : (v === "" ? "" : Number(v));
  /* Switching away from a past-failure technique drops any count entered for
     it, so a stale number cannot ride along on a set logged as clean. */
  if(k === "endedWith" && !isExtended(v)) st.extra = 0;
  if(k === "note") return;                       // state only, no re-render
  if(k === "weight" || k === "reps" || k === "extra") renderKeepFocus(k); else render();
}
function bump(id,k,delta){
  var st = entryFor(id), min = k === "reps" ? 1 : 0;
  st[k] = Math.max(min, Math.round(((Number(st[k]) || 0) + delta) * 100) / 100);
  render();
}
function commit(id){
  var st = entryFor(id), reps = Number(st.reps), weight = Number(st.weight), e = exOf(id);
  if(!reps || reps < 1) return toast("Enter reps first");
  /* Bodyweight movements log on reps alone - any belt or dumbbell load is
     optional extra. Demanding a weight made all six of them unloggable. */
  if(e.bw){ if(!(weight > 0)) weight = 0; }
  else if(!weight || weight <= 0) return toast("Enter a weight first");
  var hi = activeRange(id, st.setNum || 0)[1];
  var ew = st.endedWith;
  var role = st.role || "top";
  var submax = st.scheme === "submax";
  var extra = isExtended(ew) ? Math.max(0, Number(st.extra) || 0) : 0;
  var set = {ex:id, reps:reps, weight:weight, note:st.note || "",
             e1:e1rm(reps, weight, e.mult), vol:reps*weight*e.mult, t:new Date().toISOString(),
             role:role, setNum:st.setNum || 0};
  /* A submaximal set records the scheme instead of an ending: there was no
     failure to describe, and the scheme is what keeps it out of PRs. */
  if(submax) set.scheme = "submax"; else set.endedWith = ew;
  if(extra) set.extra = extra;
  S.draft.sets.push(set);
  save();
  var needed = slotSetsNeeded(S.draft, id);
  var logged = slotsLogged(S.draft, id);
  if(logged < needed){
    delete entry[id]; entryFor(id, true);
    toast("Set "+logged+" of "+needed+" logged");
    render(); return;
  }
  /* Past-failure work no longer suppresses the target: the reps logged are the
     clean ones and they earned whatever they earned. Only "short" holds back. */
  var tail = extra ? " +"+extra+" "+endedWithDef(ew).unit : "";
  if(submax){
    toast("Logged "+reps+" reps"+(weight ? " x "+weight : ""));
  } else if(role === "working"){
    toast("Logged "+reps+" x "+weight+tail);
  } else if(ew === "short"){
    toast("Logged "+reps+" x "+weight+" (short of failure - target unchanged)");
  } else {
    toast(reps >= hi ? "Top of range"+tail+" - "+bumpWeight(weight, e)+" lb next time"
                     : "Logged - "+reps+" x "+weight+tail, reps >= hi);
  }
  delete entry[id]; open_ = null; render();
}
function startSession(code, cycle){
  var prevBW = null;
  for(var i = S.sessions.length - 1; i >= 0; i--){ if(S.sessions[i].bodyweight != null){ prevBW = S.sessions[i].bodyweight; break; } }
  var slots = resolveSlots(code, cycle);
  var sm = {};
  slots.forEach(function(s){
    var resolved = s.sets.map(function(sd){
      var rr = sd.rrAlt ? sd.rrAlt[cycle % sd.rrAlt.length] : sd.rr;
      var out = {role:sd.role || "top"};
      if(sd.progression) out.progression = sd.progression;
      if(sd.loadFactor) out.loadFactor = sd.loadFactor;
      if(sd.scheme && sd.scheme !== "failure") out.scheme = sd.scheme;
      if(rr) out.rr = rr;
      return out;
    });
    sm[s.ex] = {sets:resolved, link:s.link};
  });
  S.draft = {date:today(), workout:code, cycle:cycle, sets:[], order:slots.map(function(s){ return s.ex; }),
             slotMap:sm, bodyweight:prevBW, instance:S.active};
  pick = null; save(); render();
}
function finishSession(){
  var d = S.draft; if(!d) return;
  if(!d.sets.length){ S.draft = null; save(); render(); return; }
  var sess = {date:d.date, workout:d.workout, cycle:d.cycle, sets:d.sets, instance:d.instance || S.active};
  if(d.bodyweight != null) sess.bodyweight = d.bodyweight;
  S.sessions.push(sess);
  S.sessions.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  S.draft = null; save(); toast("Session saved"); tab = "history"; render();
}
function swapAlt(from,to){
  S.draft.order = S.draft.order.map(function(x){ return x === from ? to : x; });
  save(); open_ = to; entryFor(to, true); render();
}
function addToday(id){ S.draft.order.push(id); adding = false; save(); open_ = id; entryFor(id, true); render(); }
function dropToday(id){
  if(S.draft.sets.some(function(s){ return s.ex === id; })) return toast("Already logged - cannot remove");
  S.draft.order = S.draft.order.filter(function(x){ return x !== id; });
  open_ = null; save(); render();
}
function move(c,i,dir){
  var l = prog()[c].list, j = i + dir;
  if(j < 0 || j >= l.length) return;
  var tmp = l[i]; l[i] = l[j]; l[j] = tmp; markEdited(); save(); render();
}
function removeEx(c,i){ prog()[c].list.splice(i,1); markEdited(); save(); toast("Removed"); render(); }
function addEx(c,id){ prog()[c].list.push(id); markEdited(); addTo = null; save(); toast("Added"); render(); }
function createEx(c){
  var g = function(id){ var el = document.getElementById(id); return el ? (el.value || "").trim() : ""; };
  var n = g("nf_n"); if(!n) return toast("Name it first");
  var rr = g("nf_r") || "6-12";
  if(!/^\d+\s*-\s*\d+$/.test(rr)) return toast("Rep range looks like 6-12");
  var mult = Number(document.getElementById("nf_m").value) || 1;
  var id = "cx_" + Date.now().toString(36);
  S.custom[id] = {n:n, g:g("nf_g") || "Other", rr:rr.replace(/\s/g,""), mult:mult,
    step:Number(g("nf_s")) || 5, pct:Number(g("nf_p")) || 5, unit: mult === 2 ? "per dumbbell" : "load", baseSet:"", baseOn:""};
  prog()[c].list.push(id); markEdited(); newForm = false; addTo = null; save(); toast(n + " added"); render();
}
function resetProgram(){
  var inst = S.instances[S.active];
  var t = TEMPLATES[inst.source];
  if(!t){ toast("Source template not found"); return; }
  if(!confirm("Reset all workouts to the "+t.name+" template? Logged sessions are kept.")) return;
  inst.program = JSON.parse(JSON.stringify(t.days));
  inst.rotation = t.rotation.slice();
  inst.rest = JSON.parse(JSON.stringify(t.rest));
  inst.edited = false;
  save(); toast("Program reset"); render();
}
/** Logged sessions belonging to one instance. */
function sessionsOf(id){
  return S.sessions.filter(function(s){ return s.instance === id; }).length;
}
/** An instance nothing would be lost by removing: no history, no edits. */
function isSpare(id){
  return !S.instances[id].edited && !sessionsOf(id);
}

function createInstance(templateId){
  var t = TEMPLATES[templateId]; if(!t) return;
  if(S.draft){ toast("Finish your session first"); return; }
  /* Tapping a card to read it used to mint a permanent copy every time, which
     is how the switcher ended up with twenty. Reading is now free (the card
     carries the blurb), and a tap that would duplicate either lands on the
     untouched copy already sitting there or asks first. */
  if(S.instances[S.active].source === templateId){ toast("Already on "+t.name); return; }
  var mine = Object.keys(S.instances).filter(function(k){ return S.instances[k].source === templateId; });
  var spare = mine.filter(isSpare)[0];
  if(spare){ switchInstance(spare); toast("Switched to "+t.name); return; }
  if(mine.length && !confirm("You already have "+t.name+". Start a second copy of it?")) return;

  /* Two creates inside the same millisecond used to collide on this key, and
     the second silently replaced the first. Suffix until it is free. */
  var id, seq = 0;
  do { id = "i" + Date.now().toString(36) + (seq ? "-" + seq.toString(36) : ""); seq++; }
  while(S.instances[id]);
  S.instances[id] = {source:templateId, name:t.name, edited:false,
    rotation:t.rotation.slice(), rest:JSON.parse(JSON.stringify(t.rest)),
    program:JSON.parse(JSON.stringify(t.days))};
  S.active = id; pick = null; editWO = null;
  save(); toast(t.name+" started"); tab = "today"; render();
}
function switchInstance(id){
  if(!S.instances[id]) return;
  if(S.draft){ toast("Finish your session first"); return; }
  S.active = id; pick = null; editWO = null;
  save(); render();
}
/* Removing a program never removes training history: an instance holding
   logged sessions is refused rather than cascading the delete, because
   orphaned sessions would still surface in History under a code that no
   longer resolves. */
function removeInstance(id){
  if(!S.instances[id]) return;
  if(S.draft){ toast("Finish your session first"); return; }
  if(Object.keys(S.instances).length < 2){ toast("That is your only program"); return; }
  var n = sessionsOf(id);
  if(n){ toast(n+" logged session"+(n === 1 ? "" : "s")+" here - export before erasing"); return; }
  if(!confirm("Remove " + S.instances[id].name + "? It has no logged sessions.")) return;
  delete S.instances[id];
  if(S.active === id) S.active = Object.keys(S.instances)[0];
  pick = null; editWO = null;
  save(); toast("Removed"); render();
}
/** Bulk cleanup for a switcher full of programs that were only ever opened. */
function pruneInstances(){
  if(S.draft){ toast("Finish your session first"); return; }
  var dead = Object.keys(S.instances).filter(function(k){ return k !== S.active && isSpare(k); });
  if(!dead.length){ toast("Nothing to clear"); return; }
  if(!confirm("Remove " + dead.length + " program" + (dead.length === 1 ? "" : "s")
    + " with no logged sessions and no edits?\n\nYour current program is kept, and so is anything you have trained or changed.")) return;
  dead.forEach(function(k){ delete S.instances[k]; });
  pick = null; editWO = null;
  save(); toast("Removed " + dead.length); render();
}
function exportJSON(){
  var A = allEx(), lib = {};
  for(var k in A){ var ex = A[k]; lib[k] = {n:ex.n, g:ex.g, rr:ex.rr, mult:ex.mult, step:ex.step, pct:ex.pct == null ? 5 : ex.pct, unit:ex.unit}; if(ex.bw) lib[k].bw = true; }
  var payload = {app:"hitlog", version:3, schema:3, exported:new Date().toISOString(),
                 instances:S.instances, active:S.active,
                 sessions:S.sessions, draft:S.draft, program:prog(), custom:S.custom, library:lib, baselines:S.baselines};
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "hitlog_"+today()+".json"; a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(input){
  var f = input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!Array.isArray(d.sessions)) throw new Error("bad");
      /* Only v2 payloads carry dates from the old UTC today() and need the
         one-time shift. A v3 export was already corrected, so carry the flag
         across - dropping it shifted every date back a day on the next load,
         compounding on each export/import round trip. */
      var wasV3 = d.schema === 3;
      if(!d.schema || d.schema < 3) d = migrateV2(d);
      S = {schema:3, dateMigrated: wasV3 || d.dateMigrated === true,
           instances:d.instances, active:d.active,
           sessions:d.sessions, draft:d.draft || null,
           custom:d.custom || {}, baselines:d.baselines || S.baselines || {}};
      save(); toast("Imported "+d.sessions.length+" sessions"); render();
    }catch(e){ toast("That is not a HIT Log export"); }
    input.value = "";
  };
  r.readAsText(f);
}
function wipe(){
  if(!confirm("Erase every logged session on this device? Export first if you want a copy.")) return;
  S.sessions = []; S.draft = null; save(); toast("Sessions erased"); render();
}
function importBaselines(input){
  var f = input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result), count = 0;
      for(var k in d){ if(d[k] && d[k].set){ S.baselines[k] = {set:d[k].set, date:d[k].date || ""}; count++; } }
      save(); toast("Loaded "+count+" baselines"); render();
    }catch(e){ toast("Bad baselines file"); }
    input.value = "";
  };
  r.readAsText(f);
}
function exportBaselines(){
  var out = {};
  var A = allEx();
  for(var id in A){
    if(S.baselines[id] && S.baselines[id].set){ out[id] = S.baselines[id]; }
    else { var b = bestFor(id); if(b) out[id] = {set:b.reps+"x"+b.weight, date:b.date}; else out[id] = {}; }
  }
  var blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "hitlog-baselines_"+today()+".json"; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------------- render ---------------- */
function render(){
  var activeCode = S.draft ? S.draft.workout : (pick || nextWorkout().code);
  if(tab !== "today") setAccent(activeCode);
  document.getElementById("view").innerHTML =
    tab === "today" ? viewToday() : tab === "history" ? viewHistory() : tab === "records" ? viewRecords() : viewData();
  document.getElementById("topMark").textContent = activeCode;
  document.getElementById("topSub").textContent = S.draft ? (S.draft.workout + " in progress") : ("next: " + nextWorkout().code);
  var btns = document.querySelectorAll(".nav button");
  for(var i=0;i<btns.length;i++) btns[i].setAttribute("aria-current", btns[i].dataset.tab === tab ? "page" : "false");
}
function renderKeepFocus(k){
  var ae = document.activeElement, pos = ae && ae.selectionStart;
  render();
  var el;
  if(k === "extra") el = document.querySelector(".card.open .ext input");
  else {
    var ins = document.querySelectorAll(".card.open .st input");
    el = k === "weight" ? ins[0] : ins[1];
  }
  if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch(e){} }
}
/* ---------------- PWA: install prompt + service worker ---------------- */
var deferredPrompt = null;
function isStandalone(){
  return window.matchMedia && window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;
}
/* iOS has never implemented beforeinstallprompt and Safari will not prompt to
   install at all - it is a manual Share -> Add to Home Screen, and no script
   can trigger it. Without this the install button is simply absent on iPhone
   and the page offers no way in. */
function isIOS(){
  var ua = navigator.userAgent || "";
  return /iPad|iPhone|iPod/.test(ua)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);  // iPadOS 13+
}
/* Add to Home Screen sits in Safari's share sheet. Chrome, Firefox and Edge on
   iOS either hide it or bury it, so it is worth saying which browser to use. */
function isIOSSafari(){
  var ua = navigator.userAgent || "";
  return isIOS() && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|GSA/.test(ua);
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();          // suppress Chrome's mini-infobar, use our own button
  deferredPrompt = e;
  if(tab === "data") render();
});
function doInstall(){
  if(!deferredPrompt) return toast("Use the browser menu, then Add to Home screen");
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then(function(){ deferredPrompt = null; render(); });
}
window.addEventListener("appinstalled", function(){ deferredPrompt = null; toast("Installed"); render(); });
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* offline support unavailable */ });
  });
}

(function(){
  var btns = document.querySelectorAll(".nav button");
  for(var i=0;i<btns.length;i++){
    btns[i].addEventListener("click", function(){
      tab = this.dataset.tab; open_ = null; adding = false; addTo = null; newForm = false; render();
    });
  }
  render();
})();
</script>
</body>
</html>
